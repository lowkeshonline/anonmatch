# nginx config for the built SPA. Mirrors the vercel.json rewrite: unknown
# paths fall back to index.html so client-side routes survive a hard reload.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames under /assets, so they are safe to cache
  # forever. A miss here is a real 404, not a route.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The API is on a different origin (see VITE_SERVER_URL), so this server only
  # ever answers for the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
